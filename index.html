<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>StudyMate AI — Personal AI Teacher</title>

<style>

/* =========================================================
   STUDYMATE AI
   HTML + CSS + JAVASCRIPT
   ========================================================= */

* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
}

:root {
    --primary: #635bff;
    --primary-dark: #5147e8;
    --secondary: #8b5cf6;
    --blue: #3b82f6;

    --bg: #f6f7fb;
    --card: #ffffff;
    --text: #111827;
    --muted: #6b7280;
    --border: #e5e7eb;

    --success: #10b981;
    --warning: #f59e0b;
    --danger: #ef4444;

    --shadow: 0 10px 35px rgba(31, 41, 55, 0.08);
}

body.dark {
    --bg: #0b1020;
    --card: #111827;
    --text: #f9fafb;
    --muted: #9ca3af;
    --border: #263244;

    background: var(--bg);
    color: var(--text);
}

body {
    font-family: Inter, ui-sans-serif, system-ui, -apple-system,
                 BlinkMacSystemFont, "Segoe UI", sans-serif;

    background: var(--bg);
    color: var(--text);

    transition: background .3s ease, color .3s ease;
}

button,
input,
textarea,
select {
    font: inherit;
}

button {
    cursor: pointer;
}

.app {
    min-height: 100vh;
}

/* =========================================================
   SIDEBAR
   ========================================================= */

.sidebar {
    position: fixed;
    left: 0;
    top: 0;

    width: 250px;
    height: 100vh;

    background: var(--card);
    border-right: 1px solid var(--border);

    padding: 24px 16px;

    display: flex;
    flex-direction: column;

    z-index: 100;
}

.logo {
    display: flex;
    align-items: center;
    gap: 10px;

    font-size: 21px;
    font-weight: 800;

    margin-bottom: 40px;
}

.logo span span {
    color: var(--primary);
}

.logo-icon {
    width: 40px;
    height: 40px;

    border-radius: 12px;

    background: linear-gradient(
        135deg,
        var(--primary),
        var(--secondary)
    );

    color: white;

    display: flex;
    align-items: center;
    justify-content: center;
}

.nav-item {
    display: flex;
    align-items: center;
    gap: 13px;

    padding: 12px 14px;

    border-radius: 12px;

    text-decoration: none;
    color: var(--muted);

    margin-bottom: 6px;

    transition: .25s;
}

.nav-item:hover {
    background: rgba(99,91,255,.08);
    color: var(--primary);
}

.nav-item.active {
    background: linear-gradient(
        135deg,
        rgba(99,91,255,.14),
        rgba(139,92,246,.10)
    );

    color: var(--primary);
    font-weight: 700;
}

.sidebar-bottom {
    margin-top: auto;
}

.xp-card {
    background: linear-gradient(
        135deg,
        var(--primary),
        var(--secondary)
    );

    color: white;

    padding: 16px;

    border-radius: 16px;

    margin-bottom: 14px;
}

.xp-top {
    display: flex;
    justify-content: space-between;
    font-size: 13px;
    margin-bottom: 10px;
}

.progress-bar {
    height: 7px;
    background: rgba(255,255,255,.25);
    border-radius: 10px;
    overflow: hidden;
}

.progress-bar div {
    height: 100%;
    background: white;
    border-radius: 10px;
}

.xp-card small {
    display: block;
    margin-top: 8px;
    opacity: .8;
}

.theme-btn {
    width: 100%;
    border: 1px solid var(--border);
    background: var(--card);
    color: var(--text);

    padding: 11px;
    border-radius: 12px;

    display: flex;
    align-items: center;
    justify-content: center;
    gap: 8px;
}

/* =========================================================
   MAIN
   ========================================================= */

.main {
    margin-left: 250px;
    min-height: 100vh;
}

.topbar {
    height: 70px;

    background: var(--card);
    border-bottom: 1px solid var(--border);

    display: flex;
    align-items: center;
    justify-content: space-between;

    padding: 0 32px;

    position: sticky;
    top: 0;
    z-index: 50;
}

.breadcrumb {
    color: var(--muted);
    font-size: 14px;
}

.top-actions {
    display: flex;
    align-items: center;
    gap: 18px;
}

.streak {
    display: flex;
    align-items: center;
    gap: 6px;

    font-size: 14px;
}

.streak svg {
    color: #f97316;
}

.avatar,
.mini-avatar {
    width: 38px;
    height: 38px;

    border-radius: 50%;

    display: flex;
    align-items: center;
    justify-content: center;

    color: white;
    font-size: 13px;
    font-weight: 700;

    background: linear-gradient(
        135deg,
        var(--primary),
        var(--secondary)
    );
}

.page {
    padding: 34px;
    max-width: 1500px;
    margin: auto;
}

/* =========================================================
   GENERAL
   ========================================================= */

.badge {
    display: inline-flex;
    align-items: center;
    gap: 7px;

    padding: 7px 12px;

    border-radius: 30px;

    background: rgba(99,91,255,.10);
    color: var(--primary);

    font-size: 13px;
    font-weight: 700;

    margin-bottom: 18px;
}

.primary-btn {
    border: none;

    padding: 13px 20px;

    border-radius: 12px;

    color: white;

    background: linear-gradient(
        135deg,
        var(--primary),
        var(--secondary)
    );

    display: inline-flex;
    align-items: center;
    justify-content: center;
    gap: 8px;

    font-weight: 700;

    transition: .25s;

    box-shadow: 0 8px 20px rgba(99,91,255,.25);
}

.primary-btn:hover {
    transform: translateY(-2px);
}

.secondary-btn {
    border: 1px solid var(--border);

    padding: 13px 20px;

    border-radius: 12px;

    color: var(--text);
    background: var(--card);

    font-weight: 700;
}

.section {
    margin-top: 80px;
}

.section-title {
    text-align: center;
    margin-bottom: 35px;
}

.section-title small {
    color: var(--primary);
    font-weight: 700;
}

.section-title h2 {
    font-size: 32px;
    margin-top: 8px;
}

.section-title p {
    color: var(--muted);
    margin-top: 8px;
}

/* =========================================================
   HERO
   ========================================================= */

.hero {
    display: grid;

    grid-template-columns: 1.05fr .95fr;

    gap: 55px;

    align-items: center;

    min-height: 650px;

    padding-top: 25px;
}

.hero h1 {
    font-size: clamp(42px, 5vw, 68px);
    line-height: 1.05;

    letter-spacing: -2px;

    max-width: 750px;
}

.hero h1 span {
    background: linear-gradient(
        90deg,
        var(--primary),
        var(--secondary)
    );

    -webkit-background-clip: text;
    color: transparent;
}

.hero p {
    color: var(--muted);

    font-size: 18px;
    line-height: 1.7;

    max-width: 650px;

    margin: 25px 0;
}

.hero-buttons {
    display: flex;
    gap: 12px;
    flex-wrap: wrap;
}

.trust {
    margin-top: 22px;

    display: flex;
    align-items: center;
    gap: 7px;

    color: var(--muted);
    font-size: 13px;
}

/* =========================================================
   DASHBOARD PREVIEW
   ========================================================= */

.dashboard-preview {
    background: var(--card);

    border: 1px solid var(--border);

    border-radius: 25px;

    padding: 24px;

    box-shadow: var(--shadow);

    transform: rotate(1deg);

    transition: .3s;
}

.dashboard-preview:hover {
    transform: rotate(0deg) translateY(-5px);
}

.preview-header {
    display: flex;
    justify-content: space-between;
    align-items: center;
}

.preview-header small {
    color: var(--muted);
}

.preview-header h3 {
    margin-top: 4px;
}

.preview-stats {
    display: grid;
    grid-template-columns: repeat(3,1fr);

    gap: 12px;

    margin-top: 22px;
}

.preview-stats div {
    background: var(--bg);
    padding: 15px;
    border-radius: 15px;
}

.preview-stats svg {
    color: var(--primary);
}

.preview-stats b {
    display: block;
    font-size: 22px;
    margin-top: 8px;
}

.preview-stats small {
    color: var(--muted);
}

.preview-chart {
    margin-top: 20px;
    padding: 18px;

    border: 1px solid var(--border);
    border-radius: 18px;
}

.chart-title {
    display: flex;
    justify-content: space-between;
}

.chart-title span {
    color: var(--success);
}

.bars {
    height: 150px;

    display: flex;
    align-items: flex-end;
    justify-content: space-around;

    margin-top: 20px;
}

.bar-wrapper {
    height: 100%;

    display: flex;
    flex-direction: column;

    justify-content: flex-end;
    align-items: center;

    gap: 7px;
}

.bar {
    width: 24px;

    border-radius: 8px 8px 3px 3px;

    background: linear-gradient(
        to top,
        var(--primary),
        var(--secondary)
    );
}

.bar-wrapper small {
    color: var(--muted);
}

.recommendation {
    display: flex;
    gap: 12px;

    margin-top: 18px;

    padding: 15px;

    border-radius: 15px;

    background: rgba(99,91,255,.08);
}

.recommendation svg {
    color: var(--primary);
}

.recommendation p {
    color: var(--muted);
    font-size: 13px;
    margin-top: 4px;
}

/* =========================================================
   STEPS
   ========================================================= */

.steps {
    display: grid;
    grid-template-columns: repeat(4,1fr);
    gap: 18px;
}

.step-card {
    background: var(--card);

    border: 1px solid var(--border);

    padding: 25px;

    border-radius: 20px;

    transition: .25s;
}

.step-card:hover {
    transform: translateY(-5px);
    box-shadow: var(--shadow);
}

.step-number {
    color: var(--primary);
    font-weight: 800;
    font-size: 13px;

    margin-bottom: 20px;
}

.step-card h3 {
    margin: 14px 0 8px;
}

.step-card p {
    color: var(--muted);
    font-size: 14px;
    line-height: 1.6;
}

/* =========================================================
   FEATURES
   ========================================================= */

.feature-grid {
    display: grid;

    grid-template-columns: repeat(3,1fr);

    gap: 18px;
}

.feature-card {
    background: var(--card);

    border: 1px solid var(--border);

    padding: 25px;

    border-radius: 20px;

    transition: .25s;
}

.feature-card:hover {
    transform: translateY(-5px);
    box-shadow: var(--shadow);
}

.feature-icon {
    width: 45px;
    height: 45px;

    border-radius: 13px;

    background: rgba(99,91,255,.10);
    color: var(--primary);

    display: flex;
    align-items: center;
    justify-content: center;

    margin-bottom: 20px;
}

.feature-card h3 {
    margin-bottom: 8px;
}

.feature-card p {
    color: var(--muted);

    line-height: 1.6;
    font-size: 14px;

    margin-bottom: 20px;
}

.feature-card > svg {
    color: var(--primary);
}

/* =========================================================
   CTA
   ========================================================= */

.cta {
    margin-top: 80px;

    padding: 65px 25px;

    border-radius: 28px;

    text-align: center;

    background: linear-gradient(
        135deg,
        #4f46e5,
        #7c3aed
    );

    color: white;
}

.cta p {
    opacity: .85;
    margin: 12px 0 25px;
}

.cta .primary-btn {
    background: white;
    color: #5147e8;
}

/* =========================================================
   PAGE HEADINGS
   ========================================================= */

.page-heading {
    margin-bottom: 30px;
}

.page-heading h1 {
    font-size: 38px;
    margin-bottom: 8px;
}

.page-heading p {
    color: var(--muted);
}

/* =========================================================
   AI TEACHER
   ========================================================= */

.teacher-layout {
    display: grid;

    grid-template-columns: 250px 1fr 220px;

    min-height: 600px;

    background: var(--card);

    border: 1px solid var(--border);

    border-radius: 22px;

    overflow: hidden;
}

.chat-sidebar {
    border-right: 1px solid var(--border);
    padding: 18px;
}

.new-chat {
    width: 100%;

    padding: 11px;

    border: 1px solid var(--border);

    border-radius: 10px;

    background: var(--card);
    color: var(--text);
}

.history-title {
    margin: 25px 0 10px;

    font-size: 11px;
    font-weight: 800;

    color: var(--muted);
}

.history-item {
    padding: 10px;

    border-radius: 9px;

    font-size: 13px;

    color: var(--muted);

    cursor: pointer;
}

.history-item:hover {
    background: var(--bg);
}

.chat-area {
    display: flex;
    flex-direction: column;
}

.chat-messages {
    flex: 1;

    padding: 25px;

    overflow-y: auto;
}

.message {
    display: flex;
    gap: 12px;

    margin-bottom: 22px;

    max-width: 850px;
}

.message.user {
    margin-left: auto;
    flex-direction: row-reverse;
}

.message-bubble {
    padding: 15px 17px;

    border-radius: 16px;

    background: var(--bg);

    line-height: 1.65;

    font-size: 14px;
}

.message.user .message-bubble {
    background: var(--primary);
    color: white;
}

.ai-avatar {
    flex-shrink: 0;

    width: 34px;
    height: 34px;

    border-radius: 10px;

    display: flex;
    align-items: center;
    justify-content: center;

    background: linear-gradient(
        135deg,
        var(--primary),
        var(--secondary)
    );

    color: white;
}

.chat-input-area {
    padding: 18px;
    border-top: 1px solid var(--border);
}

.quick-prompts {
    display: flex;
    gap: 7px;
    overflow-x: auto;

    margin-bottom: 12px;
}

.quick-prompts button {
    white-space: nowrap;

    border: 1px solid var(--border);

    background: var(--card);
    color: var(--muted);

    padding: 8px 11px;

    border-radius: 20px;

    font-size: 12px;
}

.input-row {
    display: flex;
    align-items: center;
    gap: 8px;

    border: 1px solid var(--border);

    padding: 8px;

    border-radius: 14px;
}

.input-row input {
    flex: 1;

    border: none;
    outline: none;

    background: transparent;
    color: var(--text);

    padding: 9px;
}

.icon-btn {
    width: 38px;
    height: 38px;

    border: none;

    background: transparent;
    color: var(--muted);

    border-radius: 10px;
}

.icon-btn:hover {
    background: var(--bg);
}

.send-btn {
    background: var(--primary);
    color: white;
}

.teacher-options {
    padding: 18px;

    border-left: 1px solid var(--border);
}

.teacher-options label {
    display: block;

    font-size: 12px;
    font-weight: 700;

    margin: 18px 0 7px;
}

.teacher-options select {
    width: 100%;

    padding: 10px;

    border-radius: 10px;

    border: 1px solid var(--border);

    background: var(--card);
    color: var(--text);
}

/* =========================================================
   NOTES
   ========================================================= */

.upload-zone {
    background: var(--card);

    border: 2px dashed var(--border);

    border-radius: 22px;

    padding: 55px 25px;

    text-align: center;

    transition: .25s;
}

.upload-zone:hover {
    border-color: var(--primary);
    background: rgba(99,91,255,.03);
}

.upload-icon {
    width: 65px;
    height: 65px;

    margin: auto;

    border-radius: 18px;

    background: rgba(99,91,255,.10);

    color: var(--primary);

    display: flex;
    align-items: center;
    justify-content: center;
}

.upload-zone h2 {
    margin: 18px 0 8px;
}

.upload-zone p {
    color: var(--muted);
    margin-bottom: 20px;
}

.analysis {
    margin-top: 25px;
}

.analysis-grid {
    display: grid;
    grid-template-columns: repeat(2,1fr);
    gap: 18px;
}

.analysis-card {
    background: var(--card);

    border: 1px solid var(--border);

    padding: 22px;

    border-radius: 18px;
}

.analysis-card h3 {
    margin-bottom: 13px;
}

.analysis-card ul {
    padding-left: 20px;
    color: var(--muted);
}

.analysis-card li {
    margin: 8px 0;
}

.analysis-actions {
    display: flex;
    gap: 10px;

    margin-top: 20px;
}

/* =========================================================
   QUIZ
   ========================================================= */

.quiz-settings {
    display: grid;

    grid-template-columns: repeat(4,1fr);

    gap: 15px;

    margin-bottom: 25px;
}

.form-group label {
    display: block;

    font-size: 12px;
    font-weight: 700;

    margin-bottom: 7px;
}

.form-group select,
.form-group input {
    width: 100%;

    padding: 12px;

    border: 1px solid var(--border);

    border-radius: 11px;

    background: var(--card);
    color: var(--text);

    outline: none;
}

.quiz-card {
    max-width: 850px;
    margin: 30px auto;

    background: var(--card);

    border: 1px solid var(--border);

    padding: 30px;

    border-radius: 22px;

    box-shadow: var(--shadow);
}

.quiz-meta {
    display: flex;
    justify-content: space-between;

    color: var(--muted);
    font-size: 13px;

    margin-bottom: 25px;
}

.question {
    font-size: 23px;
    line-height: 1.4;

    margin-bottom: 25px;
}

.options {
    display: grid;
    gap: 12px;
}

.option {
    padding: 15px;

    border: 1px solid var(--border);

    background: var(--card);

    color: var(--text);

    border-radius: 12px;

    text-align: left;

    transition: .2s;
}

.option:hover {
    border-color: var(--primary);
}

.option.selected {
    border-color: var(--primary);
    background: rgba(99,91,255,.08);
}

.quiz-result {
    text-align: center;
    padding: 35px;
}

.score-circle {
    width: 130px;
    height: 130px;

    border-radius: 50%;

    margin: 20px auto;

    display: flex;
    flex-direction: column;
    justify-content: center;

    background: rgba(99,91,255,.1);

    border: 8px solid var(--primary);
}

.score-circle strong {
    font-size: 32px;
}

.score-circle small {
    color: var(--muted);
}

/* =========================================================
   DASHBOARD
   ========================================================= */

.stats-grid {
    display: grid;

    grid-template-columns: repeat(4,1fr);

    gap: 18px;
}

.stat-card {
    background: var(--card);

    border: 1px solid var(--border);

    padding: 20px;

    border-radius: 18px;
}

.stat-card > svg {
    color: var(--primary);
}

.stat-card h2 {
    margin: 10px 0 4px;
}

.stat-card p {
    color: var(--muted);
    font-size: 13px;
}

.dashboard-grid {
    display: grid;

    grid-template-columns: 1.3fr .7fr;

    gap: 20px;

    margin-top: 20px;
}

.panel {
    background: var(--card);

    border: 1px solid var(--border);

    padding: 22px;

    border-radius: 20px;
}

.panel h3 {
    margin-bottom: 20px;
}

.subject-row {
    margin-bottom: 20px;
}

.subject-head {
    display: flex;
    justify-content: space-between;

    font-size: 14px;

    margin-bottom: 8px;
}

.subject-head span {
    color: var(--primary);
    font-weight: 700;
}

.subject-progress {
    height: 8px;

    background: var(--bg);

    border-radius: 20px;

    overflow: hidden;
}

.subject-progress div {
    height: 100%;

    background: linear-gradient(
        90deg,
        var(--primary),
        var(--secondary)
    );
}

.weak-area {
    display: flex;
    align-items: center;
    gap: 12px;

    padding: 14px;

    border-radius: 13px;

    background: rgba(245,158,11,.08);

    margin-bottom: 10px;
}

.weak-area svg {
    color: var(--warning);
}

/* =========================================================
   ROADMAP
   ========================================================= */

.roadmap-form {
    background: var(--card);

    border: 1px solid var(--border);

    padding: 22px;

    border-radius: 20px;

    margin-bottom: 30px;
}

.roadmap-inputs {
    display: grid;

    grid-template-columns: repeat(3,1fr);

    gap: 15px;
}

.roadmap {
    max-width: 900px;

    margin: auto;

    position: relative;
}

.roadmap::before {
    content: "";

    position: absolute;

    left: 28px;
    top: 0;
    bottom: 0;

    width: 3px;

    background: linear-gradient(
        var(--primary),
        var(--secondary)
    );
}

.roadmap-item {
    position: relative;

    padding-left: 75px;

    margin-bottom: 25px;
}

.roadmap-dot {
    position: absolute;

    left: 14px;
    top: 5px;

    width: 30px;
    height: 30px;

    border-radius: 50%;

    background: var(--primary);

    border: 5px solid var(--bg);

    z-index: 2;
}

.roadmap-card {
    background: var(--card);

    border: 1px solid var(--border);

    padding: 20px;

    border-radius: 17px;
}

.roadmap-card h3 {
    margin-bottom: 7px;
}

.roadmap-card p {
    color: var(--muted);
    font-size: 13px;
}

.roadmap-tags {
    display: flex;
    flex-wrap: wrap;

    gap: 7px;

    margin-top: 14px;
}

.tag {
    padding: 5px 9px;

    border-radius: 20px;

    background: rgba(99,91,255,.08);

    color: var(--primary);

    font-size: 11px;
}

/* =========================================================
   PROFILE
   ========================================================= */

.profile-header {
    background: linear-gradient(
        135deg,
        var(--primary),
        var(--secondary)
    );

    color: white;

    border-radius: 22px;

    padding: 35px;

    display: flex;
    align-items: center;

2. Data Link — handles frames and MAC addresses.
3. Network — handles IP addressing and routing.
4. Transport — provides reliable delivery using TCP/UDP.
5. Session — manages communication sessions.
6. Presentation — handles formatting and encryption.
7. Application — interacts with applications.

**Easy trick:**

"Please Do Not Throw Sausage Pizza Away"

Think of each layer as a step in the journey of your data.

Would you like me to create 5 practice questions on OSI?`;

    }

    if(q.includes("python")) {

        return `**Python Basics**

Common Python data types include:

• String
• Integer
• Float
• Boolean
• List
• Tuple
• Dictionary

Let's practice with a small question:

**What data type is "Hello"?**

Answer: String.`;

    }

    if(q.includes("practice") || q.includes("questions")) {

        return `**5 Practice Questions**

1. What is the main purpose of the OSI model?

2. Which OSI layer handles routing?

3. Which layer transmits raw bits?

4. Which transport protocol provides reliable delivery?

    }

**1. What it means**
**2. Why it is needed**
**3. A simple real-world example**
**4. A quick practice question**

        return `Let's use a real-world example.

Imagine you're sending a parcel.

The parcel needs to be:

1. Prepared
2. Addressed
3. Transported
4. Routed
5. Delivered

Computer networks work similarly.

Different networking layers perform different responsibilities during communication.

That's why layered models like OSI are useful.`;

    }

    return `Great question! 👏

Let's understand it step-by-step.

**Step 1 — Understand the idea**

"${question}"

function showQuestion() {

    if(quizQuestion >= quizData.length) {

        showQuizResult();

        return;

    }

    const q = quizData[quizQuestion];

    document.getElementById("quizContainer").innerHTML = `

    <div class="quiz-card">

        <div class="quiz-meta">

            <span>
                Question ${quizQuestion + 1} of ${quizData.length}
            </span>

            <span>
                ⏱ 01:24
            </span>

        </div>


        <div class="question">
            ${q.question}
        </div>


        <div class="options">

            ${q.options.map((option,index)=>`

                <button
                    class="option"
                    onclick="selectAnswer(${index})"
                    id="option${index}">

                    <b>
                        ${String.fromCharCode(65+index)}.
                    </b>

                    ${option}

                </button>

            `).join("")}

        </div>


        <button
            class="primary-btn"
            style="margin-top:22px"
            onclick="submitAnswer()">

            ${quizQuestion === quizData.length-1
                ? "Finish Quiz"
                : "Next Question →"}

        </button>

    </div>

    `;

}


function selectAnswer(index) {

    selectedAnswer = index;

    document.querySelectorAll(".option")
        .forEach((el,i)=>{
            el.classList.toggle(
                "selected",
                i === index
            );
        });

}


function submitAnswer() {

    if(selectedAnswer === null) {

        showNotification("Please select an answer first.");

        return;

    }

    if(selectedAnswer === quizData[quizQuestion].answer)
        quizScore++;

    selectedAnswer = null;

    quizQuestion++;

    showQuestion();

}


function showQuizResult() {

    const accuracy =
        Math.round(
            quizScore / quizData.length * 100
        );

    content.innerHTML = `

            <div class="stats-grid">

                <div class="stat-card">

                <div class="stat-card">

/* =========================================================

function toggleTheme() {

    document.body.classList.toggle("dark");

    const dark =
        document.body.classList.contains("dark");

    localStorage.setItem(
        "studymateDark",
        dark
    );

    document.querySelector(".theme-btn").innerHTML =
        dark ? "☀️ Light Mode" : "🌙 Dark Mode";

}


/* =========================================================
   SIDEBAR MOBILE
   ========================================================= */

function toggleSidebar() {

    document
        .getElementById("sidebar")
        .classList.toggle("mobile-show");

}


/* =========================================================
   NOTIFICATION
   ========================================================= */

function showNotification(message) {

    const notification =
        document.getElementById("notification");

    notification.innerHTML =
        "🔔 " + message;

    notification.classList.add("show");

    setTimeout(()=>{
        notification.classList.remove("show");
    },3000);

}


/* =========================================================
   FLOATING AI
   ========================================================= */

function openAI() {

    navigate("teacher");

    setTimeout(()=>{

        const input =
            document.getElementById("chatInput");

        if(input)
            input.focus();

    },100);

}


/* =========================================================
   INITIALIZATION
   ========================================================= */

if(localStorage.getItem("studymateDark") === "true") {

    document.body.classList.add("dark");

}

renderPage();
